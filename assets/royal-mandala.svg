<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <linearGradient id="manGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8DC"/>
      <stop offset="20%" stop-color="#F5D061"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="78%" stop-color="#996515"/>
      <stop offset="100%" stop-color="#FFE082"/>
    </linearGradient>
    <linearGradient id="manGleam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF"/>
      <stop offset="50%" stop-color="#F5D061"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
  </defs>

  <g transform="translate(250, 250)">
    <!-- Outer concentric rings -->
    <circle r="240" stroke="url(#manGold)" stroke-width="1.8" stroke-dasharray="4 6" opacity="0.65"/>
    <circle r="232" stroke="url(#manGold)" stroke-width="2.5"/>
    <circle r="224" stroke="url(#manGold)" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.8"/>
    <circle r="200" stroke="url(#manGold)" stroke-width="1.5" opacity="0.75"/>
    <circle r="168" stroke="url(#manGold)" stroke-width="2"/>
    <circle r="130" stroke="url(#manGold)" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle r="92" stroke="url(#manGold)" stroke-width="2"/>
    <circle r="56" stroke="url(#manGold)" stroke-width="2.5"/>
    <circle r="24" stroke="url(#manGold)" stroke-width="1.5" fill="url(#manGold)" fill-opacity="0.15"/>

    <!-- 16 Outer Floral Petals -->
    <g stroke="url(#manGold)" stroke-width="1.6" fill="url(#manGold)" fill-opacity="0.04">
      <path d="M0 -232 Q25 -210 0 -168 Q-25 -210 0 -232 Z"/>
      <path d="M0 -232 Q25 -210 0 -168 Q-25 -210 0 -232 Z" transform="rotate(22.5)"/>
      <path d="M0 -232 Q25 -210 0 -168 Q-25 -210 0 -232 Z" transform="rotate(45)"/>
      <path d="M0 -232 Q25 -210 0 -168 Q-25 -210 0 -232 Z" transform="rotate(67.5)"/>
      <path d="M0 -232 Q25 -210 0 -168 Q-25 -210 0 -232 Z" transform="rotate(90)"/>
      <path d="M0 -232 Q25 -210 0 -168 Q-25 -210 0 -232 Z" transform="rotate(112.5)"/>
      <path d="M0 -232 Q25 -210 0 -168 Q-25 -210 0 -232 Z" transform="rotate(135)"/>
      <path d="M0 -232 Q25 -210 0 -168 Q-25 -210 0 -232 Z" transform="rotate(157.5)"/>
      <path d="M0 -232 Q25 -210 0 -168 Q-25 -210 0 -232 Z" transform="rotate(180)"/>
      <path d="M0 -232 Q25 -210 0 -168 Q-25 -210 0 -232 Z" transform="rotate(202.5)"/>
      <path d="M0 -232 Q25 -210 0 -168 Q-25 -210 0 -232 Z" transform="rotate(225)"/>
      <path d="M0 -232 Q25 -210 0 -168 Q-25 -210 0 -232 Z" transform="rotate(247.5)"/>
      <path d="M0 -232 Q25 -210 0 -168 Q-25 -210 0 -232 Z" transform="rotate(270)"/>
      <path d="M0 -232 Q25 -210 0 -168 Q-25 -210 0 -232 Z" transform="rotate(292.5)"/>
      <path d="M0 -232 Q25 -210 0 -168 Q-25 -210 0 -232 Z" transform="rotate(315)"/>
      <path d="M0 -232 Q25 -210 0 -168 Q-25 -210 0 -232 Z" transform="rotate(337.5)"/>
    </g>

    <!-- Intermediate 16 Paisley / Lotus Petals -->
    <g stroke="url(#manGleam)" stroke-width="1.8" fill="url(#manGold)" fill-opacity="0.08">
      <path d="M0 -168 C35 -145 30 -115 0 -92 C-30 -115 -35 -145 0 -168 Z"/>
      <path d="M0 -168 C35 -145 30 -115 0 -92 C-30 -115 -35 -145 0 -168 Z" transform="rotate(22.5)"/>
      <path d="M0 -168 C35 -145 30 -115 0 -92 C-30 -115 -35 -145 0 -168 Z" transform="rotate(45)"/>
      <path d="M0 -168 C35 -145 30 -115 0 -92 C-30 -115 -35 -145 0 -168 Z" transform="rotate(67.5)"/>
      <path d="M0 -168 C35 -145 30 -115 0 -92 C-30 -115 -35 -145 0 -168 Z" transform="rotate(90)"/>
      <path d="M0 -168 C35 -145 30 -115 0 -92 C-30 -115 -35 -145 0 -168 Z" transform="rotate(112.5)"/>
      <path d="M0 -168 C35 -145 30 -115 0 -92 C-30 -115 -35 -145 0 -168 Z" transform="rotate(135)"/>
      <path d="M0 -168 C35 -145 30 -115 0 -92 C-30 -115 -35 -145 0 -168 Z" transform="rotate(157.5)"/>
      <path d="M0 -168 C35 -145 30 -115 0 -92 C-30 -115 -35 -145 0 -168 Z" transform="rotate(180)"/>
      <path d="M0 -168 C35 -145 30 -115 0 -92 C-30 -115 -35 -145 0 -168 Z" transform="rotate(202.5)"/>
      <path d="M0 -168 C35 -145 30 -115 0 -92 C-30 -115 -35 -145 0 -168 Z" transform="rotate(225)"/>
      <path d="M0 -168 C35 -145 30 -115 0 -92 C-30 -115 -35 -145 0 -168 Z" transform="rotate(247.5)"/>
      <path d="M0 -168 C35 -145 30 -115 0 -92 C-30 -115 -35 -145 0 -168 Z" transform="rotate(270)"/>
      <path d="M0 -168 C35 -145 30 -115 0 -92 C-30 -115 -35 -145 0 -168 Z" transform="rotate(292.5)"/>
      <path d="M0 -168 C35 -145 30 -115 0 -92 C-30 -115 -35 -145 0 -168 Z" transform="rotate(315)"/>
      <path d="M0 -168 C35 -145 30 -115 0 -92 C-30 -115 -35 -145 0 -168 Z" transform="rotate(337.5)"/>
    </g>

    <!-- Inner 8-Petal Sacred Heart Lotus -->
    <g stroke="url(#manGold)" stroke-width="2" fill="url(#manGold)" fill-opacity="0.18">
      <path d="M0 -92 C24 -75 22 -45 0 -24 C-22 -45 -24 -75 0 -92 Z"/>
      <path d="M0 -92 C24 -75 22 -45 0 -24 C-22 -45 -24 -75 0 -92 Z" transform="rotate(45)"/>
      <path d="M0 -92 C24 -75 22 -45 0 -24 C-22 -45 -24 -75 0 -92 Z" transform="rotate(90)"/>
      <path d="M0 -92 C24 -75 22 -45 0 -24 C-22 -45 -24 -75 0 -92 Z" transform="rotate(135)"/>
      <path d="M0 -92 C24 -75 22 -45 0 -24 C-22 -45 -24 -75 0 -92 Z" transform="rotate(180)"/>
      <path d="M0 -92 C24 -75 22 -45 0 -24 C-22 -45 -24 -75 0 -92 Z" transform="rotate(225)"/>
      <path d="M0 -92 C24 -75 22 -45 0 -24 C-22 -45 -24 -75 0 -92 Z" transform="rotate(270)"/>
      <path d="M0 -92 C24 -75 22 -45 0 -24 C-22 -45 -24 -75 0 -92 Z" transform="rotate(315)"/>
    </g>

    <!-- Radiating Ray Diamonds & Beads -->
    <g fill="url(#manGold)">
      <circle cx="0" cy="-228" r="3"/>
      <circle cx="0" cy="-228" r="3" transform="rotate(22.5)"/>
      <circle cx="0" cy="-228" r="3" transform="rotate(45)"/>
      <circle cx="0" cy="-228" r="3" transform="rotate(67.5)"/>
      <circle cx="0" cy="-228" r="3" transform="rotate(90)"/>
      <circle cx="0" cy="-228" r="3" transform="rotate(112.5)"/>
      <circle cx="0" cy="-228" r="3" transform="rotate(135)"/>
      <circle cx="0" cy="-228" r="3" transform="rotate(157.5)"/>
      <circle cx="0" cy="-228" r="3" transform="rotate(180)"/>
      <circle cx="0" cy="-228" r="3" transform="rotate(202.5)"/>
      <circle cx="0" cy="-228" r="3" transform="rotate(225)"/>
      <circle cx="0" cy="-228" r="3" transform="rotate(247.5)"/>
      <circle cx="0" cy="-228" r="3" transform="rotate(270)"/>
      <circle cx="0" cy="-228" r="3" transform="rotate(292.5)"/>
      <circle cx="0" cy="-228" r="3" transform="rotate(315)"/>
      <circle cx="0" cy="-228" r="3" transform="rotate(337.5)"/>
    </g>

    <!-- Center Bindu -->
    <circle r="12" fill="url(#manGold)"/>
    <circle r="6" fill="#FFF8DC"/>
  </g>
</svg>
