<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="rcGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D1"/>
      <stop offset="30%" stop-color="#F5D061"/>
      <stop offset="65%" stop-color="#D4AF37"/>
      <stop offset="85%" stop-color="#996515"/>
      <stop offset="100%" stop-color="#F3E5AB"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Outer corner frame border -->
  <path d="M4 96 V28 C4 14.7 14.7 4 28 4 H96" stroke="url(#rcGold)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M12 96 V34 C12 21.8 21.8 12 34 12 H96" stroke="url(#rcGold)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.85"/>
  <path d="M18 96 V38 C18 27 27 18 38 18 H96" stroke="url(#rcGold)" stroke-width="0.8" opacity="0.6"/>

  <!-- Corner Ornamental Paisley & Floral Filigree -->
  <path d="M4 4 C18 4 32 18 32 32 C32 44 22 52 14 44 C8 38 12 26 24 22 C34 19 46 26 48 38 C50 50 42 62 30 64" stroke="url(#rcGold)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  
  <!-- Lotus Petal Center -->
  <path d="M24 24 C28 16 38 16 42 24 C46 32 38 40 33 33 Z" fill="url(#rcGold)" opacity="0.85"/>
  <circle cx="28" cy="28" r="3" fill="#FFF8DC"/>
  <circle cx="12" cy="12" r="2.5" fill="url(#rcGold)"/>
  <circle cx="4" cy="4" r="3.5" fill="url(#rcGold)" filter="url(#goldGlow)"/>
  
  <!-- Delicate flourish tendrils -->
  <path d="M46 12 C58 10 70 14 78 8 C84 3 88 10 92 14" stroke="url(#rcGold)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M12 46 C10 58 14 70 8 78 C3 84 10 88 14 92" stroke="url(#rcGold)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  
  <!-- Tiny decorative dots -->
  <circle cx="56" cy="14" r="1.5" fill="url(#rcGold)"/>
  <circle cx="70" cy="11" r="1.5" fill="url(#rcGold)"/>
  <circle cx="84" cy="8" r="1.8" fill="url(#rcGold)"/>
  <circle cx="14" cy="56" r="1.5" fill="url(#rcGold)"/>
  <circle cx="11" cy="70" r="1.5" fill="url(#rcGold)"/>
  <circle cx="8" cy="84" r="1.8" fill="url(#rcGold)"/>
</svg>
